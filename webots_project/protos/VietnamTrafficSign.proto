#VRML_SIM R2025a utf8
# Custom Vietnamese Traffic Sign PROTO (QCVN 41:2019/BGTVT)
# Front sign face points along local -X so oncoming vehicles moving along +X see it upright.
# The sign panel Solid carries `recognitionColors` so Webots Camera Recognition returns tight 2D bounding boxes.

PROTO VietnamTrafficSign [
  field SFVec3f    translation       0 0 0
  field SFRotation rotation          0 0 1 0
  field SFString   name              "vn_traffic_sign"
  field SFString   signClass         "stop"
  field MFString   textureUrl        ["../textures/signs/stop.png"]
  field MFColor    recognitionColors [1 0 0]
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      # Metallic support pole (height 2.0m)
      Pose {
        translation 0 0 1.0
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.55 0.58 0.62
              roughness 0.45
              metalness 0.6
            }
            geometry Cylinder {
              height 2.0
              radius 0.045
              subdivision 16
            }
          }
        ]
      }
      # Sign panel Solid (tracked by Webots Camera Recognition for auto-labeling)
      Solid {
        translation 0 0 2.05
        name IS signClass
        recognitionColors IS recognitionColors
        children [
          # Metallic backing plate
          Shape {
            appearance PBRAppearance {
              baseColor 0.72 0.74 0.78
              roughness 0.5
              metalness 0.3
            }
            geometry Box {
              size 0.04 0.90 0.90
            }
          }
          # Front textured face (normal = -X, upright +Z, U left-to-right from viewer at -X)
          Shape {
            appearance PBRAppearance {
              baseColor 1 1 1
              baseColorMap ImageTexture {
                url IS textureUrl
              }
              roughness 0.6
              metalness 0
            }
            geometry IndexedFaceSet {
              coord Coordinate {
                point [
                  -0.022  0.45 -0.45
                  -0.022 -0.45 -0.45
                  -0.022 -0.45  0.45
                  -0.022  0.45  0.45
                ]
              }
              texCoord TextureCoordinate {
                point [
                  0 0
                  1 0
                  1 1
                  0 1
                ]
              }
              coordIndex [ 0 1 2 3 -1 ]
              texCoordIndex [ 0 1 2 3 -1 ]
            }
          }
        ]
        boundingObject Box {
          size 0.06 0.90 0.90
        }
      }
    ]
  }
}
